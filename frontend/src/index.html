  <!-- `js` gates the scroll-reveal styles: with no JS everything stays visible.
       If the app hasn't booted after 9s the gate lifts so nothing stays hidden. -->

    (function (d) {
      d.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__booted) d.documentElement.classList.remove('js');
      }, 9000);
    })(document);
  </script>
