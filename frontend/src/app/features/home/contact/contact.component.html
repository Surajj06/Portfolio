<section id="contact" class="section contact">
  <div class="circuit-backdrop" aria-hidden="true"></div>

  <div class="container contact-grid">
    <div class="contact-intro" appReveal>
      <h2 class="contact-title">Let's build something intelligent.</h2>

      <div class="contact-channels">
        <a [href]="'mailto:' + data.profile.email">
          <app-icon name="mail" [size]="18"></app-icon> {{ data.profile.email }}
        </a>
        <a *ngIf="data.profile.phone" [href]="'tel:' + data.profile.phone">
          <app-icon name="phone" [size]="18"></app-icon> {{ data.profile.phone }}
        </a>
        <a [href]="data.profile.linkedin" target="_blank" rel="noopener noreferrer">
          <app-icon name="linkedin" [size]="18"></app-icon> LinkedIn
        </a>
        <a [href]="data.profile.github" target="_blank" rel="noopener noreferrer">
          <app-icon name="github" [size]="18"></app-icon> GitHub
        </a>
        <a *ngIf="data.profile.instagram" [href]="data.profile.instagram" target="_blank" rel="noopener noreferrer">
          <app-icon name="instagram" [size]="18"></app-icon> Instagram
        </a>
      </div>
    </div>

    <form class="contact-form glass-panel" [formGroup]="form" (ngSubmit)="submit()" appReveal [revealDelay]="80" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" autocomplete="name" />
        <p class="field-error" *ngIf="name.invalid && name.touched">Please enter your name.</p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        <p class="field-error" *ngIf="email.invalid && email.touched">Please enter a valid email address.</p>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" rows="5" formControlName="message"></textarea>
        <p class="field-error" *ngIf="message.invalid && message.touched">Message should be at least 10 characters.</p>
      </div>

      <!-- Honeypot: hidden from real users, catches basic bots -->
      <div class="field field-honeypot" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" type="text" formControlName="website" tabindex="-1" autocomplete="off" />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="state() === 'submitting'" appMagnetic>
        {{ state() === 'submitting' ? 'Sending…' : 'Send Message' }}
      </button>

      <p class="field-success" *ngIf="state() === 'success'">Thanks — your message has been sent.</p>
      <p class="field-error" *ngIf="state() === 'error'">{{ errorMessage() }}</p>
    </form>
  </div>
</section>
