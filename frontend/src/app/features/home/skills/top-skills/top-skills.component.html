@if (topSkills.length) {
  <div class="top">
    <h3 class="top__title">Most shipped with</h3>
    <p class="top__sub">Ranked by how many of the case studies here actually use each tool.</p>

    <ol class="top__list">
      @for (skill of topSkills; track skill.name; let i = $index) {
        <li class="row" appReveal [revealDelay]="i">
          <span class="row__name">{{ skill.name }}</span>
          <span class="row__track" aria-hidden="true">
            <span class="row__fill" [style.--w]="skill.pct"></span>
          </span>
          <span class="row__n">{{ skill.projectCount }}<span class="sr-only"> projects</span></span>
        </li>
      }
    </ol>
  </div>
}
