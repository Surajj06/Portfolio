<section class="section approach" aria-labelledby="approach-title">
  <div class="container">
    <app-section-heading kicker="Methodology" headingId="approach-title">
      How I think about <em>AI engineering</em>.
    </app-section-heading>

    <ol class="steps">
      @for (step of data.approach; track step.index; let i = $index) {
        <li class="step card" appReveal [revealDelay]="i">
          <span class="step__num" aria-hidden="true">{{ step.index }}</span>
          <h3 class="step__title">{{ step.title }}</h3>
          <p class="step__text">{{ step.description }}</p>
        </li>
      }
    </ol>
  </div>
</section>
