<section class="statement section" aria-label="How I build">
  <div class="container">
    <p class="statement__text display" appSplit="words">
      Building AI systems requires more than models — it requires <em>reliable software</em>.
    </p>

    <ul class="equation" aria-label="What goes into a production AI system" appReveal>
      @for (term of equation; track term; let last = $last) {
        <li class="chip chip--solid">{{ term }}</li>
        @if (!last) {
          <li class="op" aria-hidden="true">+</li>
        }
      }
      <li class="op" aria-hidden="true">=</li>
      <li class="chip chip--lime">Production AI</li>
    </ul>
  </div>

  <app-marquee class="statement__rail" variant="chips" [items]="data.engineeringConcepts" [duration]="46" />
</section>
