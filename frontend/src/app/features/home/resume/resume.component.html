<section id="resume" class="section resume" aria-labelledby="resume-title">
  <div class="container">
    <div class="resume-card card" appReveal>
      <div class="paper" aria-hidden="true">
        <span class="paper__sheet paper__sheet--back"></span>
        <span class="paper__sheet">
          <i class="paper__name"></i>
          <i class="paper__line"></i>
          <i class="paper__line paper__line--short"></i>
          <i class="paper__block"></i>
          <i class="paper__line"></i>
          <i class="paper__line paper__line--mid"></i>
          <i class="paper__line paper__line--short"></i>
        </span>
      </div>

      <div class="resume-card__copy">
        <p class="kicker">Resume</p>
        <h2 id="resume-title" class="resume-card__title">Prefer the <em>short version</em>?</h2>
        <p class="lede">Two pages: experience, the systems I’ve shipped, and the stack — ready to forward.</p>
        <div class="resume-card__actions">
          <a class="btn btn--primary" [href]="data.profile.resumePath" [attr.download]="data.profile.resumeFileName" appMagnetic>
            Download PDF <app-icon name="download" [size]="18" />
          </a>
          <a class="btn btn--ghost" [href]="data.profile.resumePath" target="_blank" rel="noopener noreferrer">
            View online <app-icon name="external" [size]="18" />
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
