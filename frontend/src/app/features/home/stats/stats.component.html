<section class="stats" aria-label="Career highlights, by the numbers">
  <div class="container">
    <ul class="grid">
      @for (stat of data.stats; track stat.label; let i = $index) {
        <li class="stat" appReveal [revealDelay]="i">
          <p class="num" [appCountUp]="stat.value">{{ stat.value }}</p>
          <p class="label">{{ stat.label }}</p>
        </li>
      }
    </ul>
  </div>
</section>
