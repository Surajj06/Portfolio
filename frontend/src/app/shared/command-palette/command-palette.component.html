<dialog
  #dialog
  class="palette"
  aria-label="Quick navigation"
  (close)="onNativeClose()"
  (click)="onDialogClick($event)"
>
  <div class="panel">
    <div class="search">
      <app-icon name="search" [size]="18" />
      <input
        #search
        type="text"
        role="combobox"
        aria-expanded="true"
        aria-controls="pal-list"
        [attr.aria-activedescendant]="'pal-' + active()"
        placeholder="Jump to a section, project or action…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="go"
        [value]="query()"
        (input)="onInput($any($event.target).value)"
        (keydown)="onKeydown($event)"
      />
      <button type="button" class="esc" aria-label="Close" (click)="palette.close()">Esc</button>
    </div>

    <ul class="list" id="pal-list" role="listbox">
      @for (command of filtered(); track command.id; let i = $index) {
        @if (showGroup(i)) {
          <li class="group" role="presentation">{{ command.group }}</li>
        }
        <li
          [id]="'pal-' + i"
          role="option"
          class="item"
          [class.is-active]="i === active()"
          [attr.aria-selected]="i === active()"
          (pointerenter)="active.set(i)"
          (click)="run(command)"
        >
          <app-icon [name]="command.icon" [size]="17" />
          <span class="label">{{ command.label }}</span>
          <span class="hint">{{ command.hint }}</span>
        </li>
      } @empty {
        <li class="empty">No matches for “{{ query() }}”.</li>
      }
    </ul>

    <p class="foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> select</span>
      <span><kbd>Ctrl</kbd><kbd>K</kbd> toggle</span>
    </p>
  </div>
</dialog>
