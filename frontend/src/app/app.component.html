<a class="skip-link" href="#main">Skip to content</a>

<app-scroll-progress />
<app-navbar />

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<app-footer />
<app-toast />

<!-- Lazy extras. `@defer` blocks render nothing on the server and only load
     their code when wanted, so they add zero weight to first paint. -->
@defer (when cursorReady(); prefetch on idle) {
  <app-custom-cursor />
}
@defer (when palette.wanted(); prefetch on idle) {
  <app-command-palette />
}
<!-- The assistant (bottom-right) loads once the browser is idle — never on the critical path. -->
@defer (on idle) {
  <app-chat-widget />
}
